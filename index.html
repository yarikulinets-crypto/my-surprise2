<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сюрприз 🎁</title>
    <style>
        /* Анимированный градиентный фон */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
            user-select: none; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            color: white;
            font-size: 3rem;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            animation: shake 0.5s ease-in-out infinite;
            padding: 0 20px;
            z-index: 5;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
        }

        /* Стили для летающих эмодзи */
        .emoji {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }

        .fly-auto { animation: flyUp 4s linear forwards; }

        @keyframes flyUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        .pop-click { animation: popOut 0.8s ease-out forwards; }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.5) rotate(var(--r)); opacity: 0; }
        }

        /* Стили для модального окна (ПРАНК) */
        .prank-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 80%;
            max-width: 400px;
        }

        .prank-modal.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .prank-modal p {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            justify-content: space-around;
        }

        .btn {
            padding: 10px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.9); }

        .btn-yes { background-color: #4CAF50; color: white; }
        .btn-no { background-color: #f44336; color: white; }

        /* Стили для мелких окон прикола */
        .mini-prank {
            position: fixed;
            background: #ffeb3b;
            color: #d32f2f;
            padding: 15px;
            border: 3px solid #d32f2f;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            z-index: 999;
            animation: popMini 3s forwards;
            text-align: center;
            pointer-events: none; /* Чтобы не мешали кликать */
        }

        @keyframes popMini {
            0% { transform: scale(0) rotate(-20deg); opacity: 1; }
            20% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            80% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>хрен тебе а не подарок 🖕</h1>

    <script>
        const emojis = ['🎁', '🖕', '😂', '🎈', '🤡', '🍾', '💩', '🤬', '🍆', '💸'];
        
        // --- 1. АВТОМАТИЧЕСКИЕ ЭМОДЗИ ---
        function createAutoEmoji() {
            const el = document.createElement('div');
            el.className = 'emoji fly-auto';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 3 + 2) + 'rem';
            el.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 5000);
        }
        setInterval(createAutoEmoji, 500);

        // --- 2. ЭМОДЗИ ПРИ КЛИКЕ ---
        function createClickEmoji(x, y) {
            const el = document.createElement('div');
            el.className = 'emoji pop-click';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.fontSize = (Math.random() * 2 + 2) + 'rem';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 150 + 50;
            
            el.style.setProperty('--x', Math.cos(angle) * distance + 'px');
            el.style.setProperty('--y', Math.sin(angle) * distance + 'px');
            el.style.setProperty('--r', Math.random() * 720 - 360 + 'deg');

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // --- 3. ЛОГИКА ПРАНКА ---
        let isPrankActive = false; // Защита от спама окон

        document.body.addEventListener('pointerdown', function(e) {
            // Всегда спавним эмодзи
            for (let i = 0; i < 5; i++) {
                createClickEmoji(e.clientX, e.clientY);
            }

            // Если пранк еще не активен и нет открытого окна — вызываем
            if (!isPrankActive && !document.querySelector('.prank-modal')) {
                showPrankModal();
            }
        });

        function showPrankModal() {
            isPrankActive = true;

            const modal = document.createElement('div');
            modal.className = 'prank-modal';
            modal.innerHTML = `
                <p>Вы точно хотите<br>получить подарок?</p>
                <div class="btn-group">
                    <button class="btn btn-yes" id="btnYes">ДА</button>
                    <button class="btn btn-no" id="btnNo">НЕТ</button>
                </div>
            `;
            document.body.appendChild(modal);

            // Анимация появления
            setTimeout(() => modal.classList.add('show'), 10);

            // Кнопка "Нет" — просто закрывает окно
            modal.querySelector('#btnNo').addEventListener('pointerdown', (e) => {
                e.stopPropagation(); // Чтобы не спавнить эмодзи под кнопкой
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.remove();
                    isPrankActive = false;
                }, 300);
            });

            // Кнопка "Да" — запускает безумие
            modal.querySelector('#btnYes').addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                modal.remove(); // Убираем главное окно
                triggerMiniPranks(); // Запускаем рой окошек
            });
        }

        function triggerMiniPranks() {
            const texts = [
                "ХРЕН ТЕБЕ!", 
                "А НЕ ПОДАРОК!", 
                "🤡 ЛОХ 🤡", 
                "ОБМАНУЛИ!", 
                "ХА-ХА-ХА!",
                "ТЫ ПОВЕРИЛ?"
            ];
            
            let count = 0;
            const maxPranks = 15; // Количество окошек

            // Функция создания одного окошка
            const spawnMini = () => {
                if (count >= maxPranks) {
                    // Когда окошки закончились, разрешаем снова кликать
                    setTimeout(() => { isPrankActive = false; }, 3000);
                    return;
                }

                const mini = document.createElement('div');
                mini.className = 'mini-prank';
                mini.innerText = texts[Math.floor(Math.random() * texts.length)];
                
                // Рандомная позиция по экрану (чтобы не вылезали за края)
                const x = Math.random() * (window.innerWidth - 200) + 100;
                const y = Math.random() * (window.innerHeight - 100) + 50;
                
                mini.style.left = x + 'px';
                mini.style.top = y + 'px';

                document.body.appendChild(mini);
                
                // Удаляем через 3 секунды (когда закончится анимация)
                setTimeout(() => mini.remove(), 3000);

                count++;
                // Следующее окошко через случайное время (100-300 мс)
                setTimeout(spawnMini, Math.random() * 200 + 100);
            };

            spawnMini();
        }
    </script>
</body>
</html>
