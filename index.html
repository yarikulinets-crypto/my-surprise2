<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сюрприз 🎁</title>
    <style>
        /* Анимированный градиентный фон */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Чтобы эмодзи не создавали скролл */
        }

        /* Анимация для фона */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Стиль для текста */
        h1 {
            color: white;
            font-size: 3rem;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            /* Анимация "дрожания" текста */
            animation: shake 0.5s ease-in-out infinite;
            padding: 0 20px;
        }

        /* Анимация дрожания */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
        }

        /* Стиль для летающих эмодзи */
        .emoji {
            position: absolute;
            font-size: 3rem;
            user-select: none;
            pointer-events: none;
            /* Анимация поднятия вверх */
            animation: flyUp 4s linear forwards;
        }

        /* Анимация полета эмодзи */
        @keyframes flyUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>хрен тебе а не подарок 🖕</h1>

    <script>
        // Список эмодзи, которые будут летать
        const emojis = ['🎁', '🖕', '😂', '🎈', '🤡', '🍾', '💩'];
        
        // Функция для создания одного летающего эмодзи
        function createEmoji() {
            const el = document.createElement('div');
            el.className = 'emoji';
            // Выбираем случайный эмодзи
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            // Случайная позиция по горизонтали
            el.style.left = Math.random() * 100 + 'vw';
            // Случайная скорость (от 2 до 5 секунд)
            el.style.animationDuration = (Math.random() * 3 + 2) + 's';
            // Случайный размер (от 2 до 5rem)
            el.style.fontSize = (Math.random() * 3 + 2) + 'rem';
            
            document.body.appendChild(el);

            // Удаляем эмодзи из кода после завершения анимации (чтобы не грузить браузер)
            setTimeout(() => {
                el.remove();
            }, 5000);
        }

        // Запускаем создание эмодзи каждые 300 миллисекунд
        setInterval(createEmoji, 300);
    </script>

</body>
</html>
