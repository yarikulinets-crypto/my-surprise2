<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сюрприз 🎁</title>
    <style>
        /* Анимированный градиентный фон */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
            /* Отключаем выделение текста при быстрых кликах */
            user-select: none; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            color: white;
            font-size: 3rem;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            animation: shake 0.5s ease-in-out infinite;
            padding: 0 20px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
        }

        /* Общий стиль для эмодзи */
        .emoji {
            position: absolute;
            user-select: none;
            pointer-events: none;
            z-index: 10;
        }

        /* Анимация для автоматически вылетающих эмодзи (снизу вверх) */
        .fly-auto {
            animation: flyUp 4s linear forwards;
        }

        @keyframes flyUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        /* Анимация для эмодзи, вылетающих при клике (разлетаются в стороны) */
        .pop-click {
            animation: popOut 0.8s ease-out forwards;
        }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.5) rotate(var(--r)); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>хрен тебе а не подарок 🖕</h1>

    <script>
        const emojis = ['🎁', '🖕', '😂', '🎈', '🤡', '🍾', '💩', '🤬', '🍆', '💸'];
        
        // --- 1. АВТОМАТИЧЕСКИЕ ЭМОДЗИ (Летят снизу вверх) ---
        function createAutoEmoji() {
            const el = document.createElement('div');
            el.className = 'emoji fly-auto';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 3 + 2) + 'rem';
            el.style.animationDuration = (Math.random() * 3 + 2) + 's';
            
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 5000);
        }
        setInterval(createAutoEmoji, 400); // Создаем каждые 0.4 сек

        // --- 2. ЭМОДЗИ ПРИ КЛИКЕ / ТАПЕ (Разлетаются брызгами) ---
        document.body.addEventListener('pointerdown', function(e) {
            // Создаем 5 эмодзи при каждом клике
            for (let i = 0; i < 5; i++) {
                createClickEmoji(e.clientX, e.clientY);
            }
        });

        function createClickEmoji(x, y) {
            const el = document.createElement('div');
            el.className = 'emoji pop-click';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Позиция там, где тапнули
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.fontSize = (Math.random() * 2 + 2) + 'rem';
            
            // Вычисляем случайное направление разлета (от -180 до 180 градусов)
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 150 + 50; // Разлетаются на 50-200 пикселей
            
            // Передаем координаты в CSS через переменные
            el.style.setProperty('--x', Math.cos(angle) * distance + 'px');
            el.style.setProperty('--y', Math.sin(angle) * distance + 'px');
            el.style.setProperty('--r', Math.random() * 720 - 360 + 'deg'); // Случайный поворот

            document.body.appendChild(el);
            
            // Удаляем через 1 секунду (после завершения анимации)
            setTimeout(() => el.remove(), 1000);
        }
    </script>

</body>
</html>
